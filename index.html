<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENGR 120 Tools</title>
  <style>
    :root {
      --bg: #0b1826;
      --panel: #0e2035;
      --panel-hover: #12294380;
      --border: #1b3857;
      --border-hover: #38bdf8;
      --text: #e2e8f0;
      --dim: #8098b0;
      --accent: #38bdf8;
      --tag: #22304a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 64px 24px 80px;
    }
    header { margin-bottom: 40px; }
    h1 {
      font-size: 1.6rem;
      margin: 0 0 6px;
      letter-spacing: -0.01em;
    }
    header p {
      margin: 0;
      color: var(--dim);
      font-size: 0.95rem;
    }
    .tools {
      display: grid;
      gap: 12px;
    }
    .tool {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
    }
    a.tool:hover {
      border-color: var(--border-hover);
      background: var(--panel-hover);
      transform: translateY(-1px);
    }
    .tool-top {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 4px;
    }
    .tool-name {
      font-size: 1.05rem;
      font-weight: 600;
    }
    a.tool .tool-name::after {
      content: " \2192";
      color: var(--accent);
    }
    .tool-desc {
      color: var(--dim);
      font-size: 0.9rem;
    }
    .tag {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: var(--tag);
      color: var(--dim);
      padding: 2px 7px;
      border-radius: 5px;
      font-weight: 600;
    }
    .tool.planned {
      opacity: 0.55;
      cursor: default;
    }
    footer {
      margin-top: 48px;
      color: var(--dim);
      font-size: 0.8rem;
    }
    footer a { color: var(--dim); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>ENGR 120 Tools</h1>
      <p>Interactive tools for structural and mechanical analysis.</p>
    </header>

    <div class="tools" id="tools"></div>

    <footer>
      <a href="https://github.com/dinocrates/engr-120-tools">Source on GitHub</a>
    </footer>
  </div>

  <script>
    // One entry per tool. Set href to null for tools that aren't built yet.
    const TOOLS = [
      {
        name: "Beam Analysis",
        href: "./beam-analysis/",
        desc: "Drag-and-drop beam loading with real-time shear and bending moment diagrams.",
      },
      {
        name: "Pneumatic Circuit Simulator",
        href: "./pneumatics-simulator/",
        desc: "Build a pneumatic schematic, run it, and operate the valves as the cylinders respond.",
        tag: "MVP",
      },
    ];

    const container = document.getElementById("tools");
    for (const tool of TOOLS) {
      const built = Boolean(tool.href);
      const el = document.createElement(built ? "a" : "div");
      el.className = "tool" + (built ? "" : " planned");
      if (built) el.href = tool.href;
      el.innerHTML = `
        <div class="tool-top">
          <span class="tool-name">${tool.name}</span>
          ${tool.tag ? `<span class="tag">${tool.tag}</span>` : ""}
        </div>
        <div class="tool-desc">${tool.desc}</div>`;
      container.appendChild(el);
    }
  </script>
</body>
</html>
