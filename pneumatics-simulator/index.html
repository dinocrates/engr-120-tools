<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='2' fill='%23081C3C'/%3E%3Crect x='3' y='6' width='7' height='4' fill='none' stroke='%2375D9FF' stroke-width='1.2'/%3E%3Cline x1='10' y1='8' x2='14' y2='8' stroke='%2375D9FF' stroke-width='1.6'/%3E%3C/svg%3E"
    />
    <title>Pneumatic Circuit Simulator</title>
  </head>
  <body>
    <div id="app">
      <header id="brand"></header>

      <div class="workspace">
        <div class="toolbar">
          <div class="project">
            <span id="projectName">Untitled circuit</span>
            <small id="saveStatus">Not saved</small>
          </div>
          <div class="segments" role="group" aria-label="Component representation">
            <button id="viewSymbol" type="button" aria-pressed="true">Symbols</button>
            <button id="viewComponent" type="button" aria-pressed="false">Components</button>
          </div>
          <div class="toolbar-actions" id="toolbar-actions"></div>
        </div>

        <div class="main">
          <aside class="library" id="library"></aside>

          <main class="canvas">
            <div class="canvas-bar">
              <span class="badge" id="stateBadge">EDIT · SYMBOLS</span>
              <div id="canvas-tools"></div>
            </div>
            <div class="canvas-surface" id="workspace"></div>
            <div class="legend">
              <span style="--c: var(--pressure)">Pressurized</span>
              <span style="--c: var(--exhaust)">Exhaust</span>
              <span style="--c: var(--inactive)">Inactive</span>
              <span style="--c: var(--trapped)">Trapped</span>
            </div>
          </main>

          <aside class="inspector" id="inspector">
            <section class="run-controls" id="run-controls" hidden></section>
            <section id="properties"></section>
          </aside>
        </div>

        <div class="controlbar" id="sim-controls"></div>
      </div>

      <div class="statusstrip" id="status"></div>
    </div>

    <input type="file" id="fileInput" accept="application/json" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
